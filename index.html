<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmartSCADA - 工业数据采集与监控系统" />
    <meta name="theme-color" content="#409eff" />
    <title>SmartSCADA</title>
    <style>
      /* 首屏加载动画 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
        z-index: 9999;
        transition: opacity 0.3s;
      }
      #app-loading.hide { opacity: 0; pointer-events: none; }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e4e7ed;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loading-text {
        margin-top: 16px;
        color: #909399;
        font-size: 14px;
        font-family: 'Helvetica Neue', sans-serif;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">SmartSCADA 加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Vue 挂载后移除 loading
      window.addEventListener('load', () => {
        setTimeout(() => {
          const el = document.getElementById('app-loading');
          if (el) { el.classList.add('hide'); setTimeout(() => el.remove(), 300); }
        }, 500);
      });
    </script>
  </body>
</html>
