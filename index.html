<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmartSCADA - 工业数据采集与监控系统" />
    <meta name="theme-color" content="#409eff" />
    <title>SmartSCADA</title>
    <style>
      /* 首屏加载动画 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
        z-index: 9999;
        transition: opacity 0.3s;
      }
      #app-loading.hide { opacity: 0; pointer-events: none; }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e4e7ed;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loading-text {
        margin-top: 16px;
        color: #909399;
        font-size: 14px;
        font-family: 'Helvetica Neue', sans-serif;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">SmartSCADA 加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Vue 挂载后移除 loading — 由 App.vue 的 onMounted 调用
      window.__removeLoading = function() {
        const el = document.getElementById('app-loading');
        if (el) { el.classList.add('hide'); setTimeout(() => el.remove(), 300); }
      };
      // 兜底：8 秒后如果 Vue 还没挂载，也移除 loading（显示空白让错误处理器接管）
      setTimeout(function() {
        if (window.__removeLoading) window.__removeLoading();
      }, 8000);
      // Vue 挂载超时检测
      setTimeout(function() {
        var app = document.getElementById('app');
        if (app && app.children.length <= 1 && app.querySelector('#app-loading')) {
          var el = document.getElementById('app-loading');
          if (el) {
            el.querySelector('.loading-text').innerHTML =
              '<div style="color:#e6a23c;font-weight:bold;margin-bottom:8px">⚠ 加载超时</div>' +
              '<div style="font-size:12px;max-width:600px;text-align:left">' +
              'Vue 应用未能在 10 秒内挂载。可能原因：<br>' +
              '1. 后端服务未启动（端口 5000）<br>' +
              '2. JavaScript 模块加载失败<br>' +
              '3. 网络连接问题' +
              '</div>';
            el.querySelector('.loading-spinner').style.display = 'none';
          }
        }
      }, 10000);
      // 全局错误捕获 — 白屏时显示错误信息
      window.onerror = function(msg, url, line, col, err) {
        var el = document.getElementById('app-loading');
        if (el) {
          el.querySelector('.loading-text').innerHTML =
            '<div style="color:#f56c6c;font-weight:bold;margin-bottom:8px">⚠ 加载出错</div>' +
            '<div style="font-size:12px;max-width:600px;word-break:break-all;text-align:left">' +
            (msg || '未知错误') + (line ? ' (行 ' + line + ')' : '') +
            '</div>' +
            '<div style="font-size:11px;color:#999;margin-top:8px">请检查后端服务是否在端口 5000 上运行</div>';
          el.querySelector('.loading-spinner').style.display = 'none';
        }
        console.error('[Global Error]', msg, url, line, col, err);
      };
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[Unhandled Promise]', e.reason);
        var el = document.getElementById('app-loading');
        if (el && el.querySelector('.loading-text')) {
          el.querySelector('.loading-text').innerHTML =
            '<div style="color:#e6a23c;font-weight:bold;margin-bottom:8px">⚠ 异步错误</div>' +
            '<div style="font-size:12px;max-width:600px;word-break:break-all;text-align:left">' +
            (e.reason?.message || e.reason || '未知异步错误') +
            '</div>';
          el.querySelector('.loading-spinner').style.display = 'none';
        }
      });
    </script>
  </body>
</html>
