name: SmartSCADA Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # 前端仓库此前**零 CI** —— 类型错误、构建失败、单测回归全靠人工在本机跑，
    # 而本机 `npm run build` 里 `vue-tsc` 是硬前置，一旦类型挂了构建就整个停摆
    # （历史上 `electron:build` 长期跑不通就是这个原因）。
    #
    # 跑 ubuntu 而非 windows：`vue-tsc` / `vite build` / `vitest` 是纯 Node 工具链，
    # 与平台无关，ubuntu 更快更省额度。Windows 专属的部分是 **Electron 打包**
    # （`electron:build --win`），它需要先有后端 PyInstaller 产物，属于独立议题，
    # 不在本 workflow 范围（见后端仓库的交付链待办 P3-c）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 = 当前 LTS，与本地开发用的版本一致
          node-version: '22'
          cache: npm

      # 用 npm ci 而不是 npm install：严格按 package-lock.json 安装，
      # 保证 CI 与本地、以及两次 CI 之间依赖树完全一致。
      # （lockfile 与 package.json 不同步时它会直接失败，这本身也是一道校验。）
      - name: Install dependencies
        run: npm ci

      # package.json 的 build = `vue-tsc --noEmit && vite build`
      # 即类型检查 + 打包，一条命令覆盖两项。
      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: warn

  electron-build:
    # 证明 Electron 发布链可复现：Windows NSIS 安装包。
    #
    # 跨仓库产物传递方案（关键决策）：
    #   后端 PyInstaller 产物由 industrial_scada 仓库（github.com/chenxinghang-a/scada）
    #   的 build-backend job 产出，但 actions/download-artifact **只能下载同一仓库
    #   同一 workflow run 的 artifact**，跨仓库拿不到。因此本 job 不自建依赖，
    #   而是直接 checkout 后端仓库源码、在本 job 内用 scada-backend.spec 现打
    #   后端产物 —— 单 workflow 即可复现完整安装包，不依赖任何开发机状态。
    #
    #   后端仓库为私有时，给下面第二个 checkout 加：
    #     token: ${{ secrets.SCADA_BACKEND_PAT }}
    runs-on: windows-latest
    env:
      # 后端 datas 目标含中文目录名（采集层/报警层/...），必须 UTF-8 模式。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend source (industrial_scada)
        uses: actions/checkout@v4
        with:
          repository: chenxinghang-a/scada
          path: backend-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend-src/requirements.txt

      - name: Build backend with PyInstaller
        working-directory: backend-src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller scada-backend.spec --noconfirm --clean

      - name: Stage backend into extraResources dir
        # package.json 的 extraResources 把 backend/ 整体打进安装包；
        # electron/main.js 期望 <resources>/backend/scada-backend.exe。
        #
        # 必须先清空构建产物再复制，不能只 Copy-Item -Force：
        #   -Force 只覆盖**同名**文件，上一世代的残留（旧 _internal/ 里的模块、
        #   已删除的依赖、运行日志）会原样留着并被打进安装包 ——
        #   表现为"新版本装完仍带着旧版本的部分文件"，极难排查。
        #
        # 安全性：CI 是全新 clone，backend/ 下只有受版本控制的内容
        # （当前仅 build_entry.py）。下面的清理只针对 PyInstaller 输出
        # 与运行期垃圾，删的是本 job 将要重建的东西，不会动到源码文件。
        # 清理后做一次断言：若还有早于本次构建的文件，说明清得不干净。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend | Out-Null

          # 清理上一世代产物与运行期垃圾（均为 .gitignore 覆盖范围）
          Get-ChildItem -Path backend -Force | Where-Object {
            $_.Name -in @('scada-backend.exe', '_internal', 'logs', 'data', 'exports') -or
            $_.Extension -eq '.log'
          } | ForEach-Object {
            Write-Host "removing stale: $($_.Name)"
            Remove-Item -Recurse -Force $_.FullName
          }

          # 复制本 job 刚构建的产物
          Copy-Item -Recurse -Force backend-src/dist/scada-backend/* backend/

          if (-not (Test-Path backend/scada-backend.exe)) { throw "backend exe missing" }

          # 断言：backend/ 中不应存在早于本次构建的文件。
          # 构建刚发生，任何超过 1 小时的文件都意味着残留没清干净；
          # build_entry.py 是 clone 下来的跟踪文件，排除在外。
          $stale = Get-ChildItem -Path backend -Recurse -File |
            Where-Object { $_.LastWriteTime -lt (Get-Date).AddHours(-1) -and $_.Name -ne 'build_entry.py' }
          if ($stale) {
            Write-Host "残留文件（前 10 个）:"
            $stale | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "backend/ 中存在 $($stale.Count) 个上一世代残留文件，会污染安装包"
          }

          Write-Host "backend/ 暂存完成，文件数: $((Get-ChildItem -Path backend -Recurse -File).Count)"
          Write-Host "入口: $((Get-Item backend/scada-backend.exe).Length) bytes"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify dist integrity (fail-closed gate)
        # 与 npm run electron:build 保持一致：那道闸门会拒绝「index.html 引用了
        # 不存在的产物」的 dist 打包。此前本 job 直接调 electron-builder，
        # **绕过了这道门** —— 而正是这条路径让 2026-09-20 那版带缺陷的安装包
        # 流了出去（Element Plus 357KB 样式被 after-pack 补丁抹掉，应用无样式）。
        # 闸门只在本机被删除保护截断 dist 时才红，但「CI 与发布脚本用同一道门」
        # 是原则问题：绕过闸门的构建产物不该被信任。
        run: npm run verify:dist

      - name: Build NSIS installer
        # 不走 npm run electron:build（它会再跑一遍 build），直接调 electron-builder。
        #
        # 输出重定向到文件而不是只打控制台：失败时用
        # .github/scripts/emit_electron_failure.py 把关键行发成 annotation。
        #
        # 为什么必须走 annotation：CI 挂在远端时拿不到 job log
        # （`/actions/jobs/{id}/logs` 需要管理员权限，只读访问 403），
        # 而这是唯一公开可读的通道。本机复现不了本步骤失败
        # （本机可成功产出安装包），所以远端日志是唯一线索。
        #
        # --publish never 是必须的：electron-builder 检测到自己运行在
        # GitHub Actions（GITHUB_ACTIONS=true）时会自动进入发布流程，
        # 即使 package.json 里没有 publish 配置。缺 GH_TOKEN 时报
        #   ⨯ GitHub Personal Access Token is not set, neither programmatically,
        #     nor using env "GH_TOKEN"
        # 并 exit 1 —— 注意此时 NSIS 安装包**已经构建完成**，纯粹是随后的
        # 发布阶段把 job 拖红。本机没有 GITHUB_ACTIONS 环境变量，所以不触发
        # 该路径，这就是"本机绿、CI 红"的全部原因。
        # 本仓库的发布是手动 upload-artifact，不需要在此自动发 release。
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee electron-build.log

      - name: Verify asar integrity
        # 第二道闸门：安装包内 app.asar 的 dist/index.html 引用必须全部存在且非空。
        # 与 npm run verify:asar 是同一支脚本，理由同上 —— CI 不得绕过发布闸门。
        run: node tools/verify-asar.js release/win-unpacked/resources/app.asar

      - name: Report build failure as annotation
        # 只在失败时执行：把 electron-builder 的关键行发成 annotation，
        # 让"为什么红"在远端可直接查询，而不是只有 exit code 1。
        if: failure()
        shell: bash
        run: python .github/scripts/emit_electron_failure.py

      - name: Show disk usage (diagnostics)
        # Windows runner 的 C: 盘约 70 GB 可用，但本步骤要同时容纳：
        #   backend-src/ 源码 + PyInstaller 产物（约 113 MB）
        #   node_modules（约 400 MB）+ .vite 缓存
        #   release/win-unpacked（约 350 MB）+ NSIS 安装包（约 150 MB）
        # 磁盘紧张时报错信息往往很隐晦（ENOSPC / makensis 失败），
        # 所以无论成败都把磁盘状况留在日志里备查。
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Upload electron-builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-build-log
          path: electron-build.log
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: SmartSCADA-NSIS
          path: release/*.exe
          if-no-files-found: error
