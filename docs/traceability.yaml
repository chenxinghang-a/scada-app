meta:
  project: SmartSCADA 工业数据采集与监控系统
  version: 1.3.1091
  date: '2026-10-25'
  author: 陈星行
  scope: 模拟模式（simulation mode），30 台虚拟设备
requirements:
- id: ALM-01
  category: 报警
  requirement: 报警应按 ISA-18.2 区分优先级，高优先级占比不超过 5%
  source: ANSI/ISA-18.2-2016 报警优先级分层
  implementation: 报警层/alarm_manager.py 的优先级矩阵；alarm_level 字段
  verification: python tools/isa18-kpi.py --hours 24
  evidence: reports/isa18.json
  status: verified
  note: 本项目实测 critical 占比偏高（样本仅 1 条），已由工具自动判定并标注"样本不足"
- id: ALM-02
  category: 报警
  requirement: 报警率应可测量，稳态不超过 6 条/小时/操作员
  source: ANSI/ISA-18.2-2016 报警率指标
  implementation: tools/isa18-kpi.py 按 trigger_count 求和计算
  verification: python tools/isa18-kpi.py --hours 1
  evidence: reports/isa18-v7.json
  status: verified
  note: 口径关键点 —— alarm_records 对同一报警去重，按行数算会把"300 次触发"算成"1 条"
- id: ALM-03
  category: 报警
  requirement: 应能识别陈旧报警（未确认且超过 24 小时）
  source: ISA-18.2 要求陈旧报警数为 0
  implementation: tools/isa18-kpi.py 的 stale_alarms 检查
  verification: python tools/isa18-kpi.py
  evidence: reports/isa18.json
  status: verified
- id: ALM-04
  category: 报警
  requirement: 报警触发后应能在 UI 上被看见（端到端链路）
  source: 功能需求
  implementation: 报警层/alarm_manager.py → 展示层/api/api_alarms.py → src/views/Dashboard.vue
  verification: python tools/fault-drill.py（注入故障，观察报警出现时刻）
  evidence: reports/fault-drill-full.json
  status: verified
  note: 实测注入 overheating 后 12 秒越过 180°C 阈值，同一采样点 temp_high 出现
- id: DATA-01
  category: 数据
  requirement: 每个测量值应带质量戳，且历史数据也要能追溯质量
  source: OPC UA StatusCode；IEC 62443 数据完整性
  implementation: 存储层/database.py 建表 + 批量 INSERT（第 11 项补丁）
  verification: python tools/data-quality-audit.py
  evidence: reports/quality-after.json
  status: verified
  note: 修复前 history_data 无 quality 列（30.8 万条无法追溯）；修复后存量留 NULL、新数据带真实质量
- id: DATA-02
  category: 数据
  requirement: 强制杀进程后，已提交的数据不得丢失
  source: 事务持久性（ACID-D）
  implementation: SQLite WAL 模式 + 批量事务提交
  verification: powershell -f tools/crash-recovery-drill.ps1
  evidence: reports/crash-recovery.json
  status: verified
  note: 实测 kill -9：3029 → 3063（末批已提交 WAL）→ 重启 4419，零丢失
- id: DATA-03
  category: 数据
  requirement: 同一条记录里的多个时间字段必须指向同一时刻；跨表可直接按时间关联
  source: 时钟一致性（工业系统通用要求）
  implementation: core/timebase.py + history_data.ts_utc 实体列（31 万行回填）
    + tools/deepcheck/schema_clock.py（口径登记表 + 生成列派生 *_utc）
    + tools/deepcheck/clock_lint.py（静态门禁）
  verification: python tools/deep-verify.py timebase  →  det_data_time / det_timebase_all / det_clock_lint
  evidence: reports/deep/timebase.json、timebase_all.json、clock_lint.json、timebase-migration.json
  status: verified
  note: 实测库内 timestamp 与 created_at 恒定相差 8.000031 小时（315146 行样本，标准差≈0）
    —— 不是时钟漂移，是「本地时间 vs UTC」的基准混用。迁移后 ts_utc 与 created_at 平均
    相差 0.4 秒、99.995% 完全同秒，另 17 行系队列缓冲（最大 628 秒）。
    判据用「入库延迟 lag 的双边界」而不是平均差：2 万行里 500 行偏 2 小时，均值只动 180 秒，
    会被平均抹平——负向控制第 5 项即用此手法验证。
    全库收口：5 张业务表 7 个时间列全部登记口径，local 列由 SQLite **生成列**派生
    *_utc（不存在第二条写入路径，漏写与漂移在结构上不可能）；operation_logs 标为 UTC；
    users/jwt_blacklist/cache 登记 exempt 并写理由。clock_lint 扫描 136 个源文件，
    新增未登记的时间列会直接失败。
    仍未覆盖：跨进程时钟同步（需 NTP 部署）、真实设备侧时钟。
- id: DATA-04
  category: 数据
  requirement: 历史查询的时间范围参数应正确映射（不能整体偏移时区）
  source: 功能需求
  implementation: 展示层/api/api_data.py 的 _parse_time（主仓已修，非本次补丁）
  verification: 见 reports/ 早期探测记录；查询 1 小时窗口返回 14 条而非 0 条
  evidence: reports/evidence/data-04-history-timezone.json
  status: verified
  note: 修好了但当时没落盘 JSON 证据，属"验证过但没留证"
- id: CTRL-01
  category: 控制
  requirement: 写操作前必须确认设备真实在线（不能依赖过期缓存）
  source: 功能安全 —— 避免对离线设备下发指令
  implementation: 智能层/device_control.py 写前实时查询 client.connected（第 7 项补丁）
  verification: POST /devices/<id>/write-coil 返回 success=true；修复前 100% 被拒
  evidence: reports/evidence/ctrl-01-write-when-online.json
  status: verified
  note: 修复前所有写入被"通信断开"拒绝，而设备在线、数据在流
- id: CTRL-02
  category: 控制
  requirement: 写入后应回读验证，不能只看接口返回
  source: 功能安全
  implementation: 智能层/device_control.py 的 write_with_verification
  verification: 写线圈返回 {"success":true,"verified":true}
  evidence: ''
  status: partial
  note: 验证逻辑正确，但模拟模式下写入值会被行为模拟器覆盖，回读不可信（真实设备不受影响）
- id: SEC-01
  category: 安全
  requirement: 不同用户的请求不得被误判为"重复提交"
  source: 可用性 + 并发正确性
  implementation: core/request_dedup.py 用完整 token 的 sha256 摘要（第 8 项补丁）
  verification: python tools/perm-audit.js（4 角色 × 6 操作矩阵）
  evidence: reports/evidence/sec-01-dedup-cross-user.json
  status: verified
  note: 修复前四个角色依次调同一接口，后三个全 409 —— 看起来像没权限，其实是去重误伤
- id: SEC-02
  category: 安全
  requirement: 权限应按角色收敛（管理员/工程师/操作员/观察者）
  source: GB/T 22239 访问控制；等保 2.0
  implementation: 用户层/auth.py 的 ROLES + API 装饰器
  verification: node tools/perm-audit.js
  evidence: reports/evidence/sec-02-perm-matrix.json
  status: partial
  note: 唯一不符预期 —— PUT /api/config 装饰器允许 engineer，但 ROLES 里 engineer 无 system_config 权限。 两处口径矛盾属设计意图问题，未擅自改，留给主仓确认
- id: OPS-01
  category: 运维
  requirement: 性能监控应能提供 24 小时趋势（不是只有瞬时值）
  source: 运维需求
  implementation: 展示层/api/api_performance.py 进程内 60s 自采样（第 4 项补丁）
  verification: GET /api/performance/metrics/history 返回采样点；页面显示"近 24 小时均/峰"
  evidence: reports/evidence/ops-01-performance-history.json
  status: verified
  note: 修复前 metrics.jsonl 只有一个从没被启动过的 CLI 会写，趋势永远为空
- id: OPS-02
  category: 运维
  requirement: 设备状态类寄存器必须产出合法状态码（0–5），不能被模拟成浮点
  source: ISA-95 设备状态机
  implementation: 采集层/enhanced_simulated_client.py 的 _sim_value_for（第 9 项补丁）
  verification: 启动后日志中「OEE 设备状态码未定义」从 87 条/分 降至 0
  evidence: reports/evidence/ops-02-state-codes.json
  status: verified
- id: OPS-03
  category: 运维
  requirement: 工业 4.0 指标（OEE/能源/碳排）应有实际数值，不能恒为 0
  source: 功能需求（工业 4.0 模块）
  implementation: core/simulation_initializer.py 的 initialize_all + 智能层/oee_calculator.seed_run_time（第 2/3/5 项补丁）
  verification: GET /api/industry40/oee 平均 70.2%；/energy 2649 kWh / 1539 kg
  evidence: reports/evidence/ops-03-industry40-metrics.json
  status: verified
  note: 修复前 OEE 恒 0.07%、能源恒 0
- id: UI-01
  category: 界面
  requirement: 进入页面后应立即看到有效内容，而不是要求用户先做选择
  source: 可用性需求
  implementation: History.vue / Control.vue / Industry40.vue 的默认选中逻辑
  verification: node tools/ui-audit.js（11 个页面文本长度与空块统计）
  evidence: reports/evidence/ui-01-pages.log
  status: verified
  note: 修复前历史页/控制页/SPC 首屏全是「请选择设备」
- id: UI-02
  category: 界面
  requirement: 数据大屏的数字必须在刷新（不能是静态快照）
  source: 可用性需求（答辩场景）
  implementation: src/views/Screen.vue 的 10s 定时器 + WebSocket 推送
  verification: node tools/screen-audit.js（隔 8 秒采两次快照比对）
  evidence: reports/evidence/ui-02-screen.log
  status: verified
  note: 实测吞吐 2308→2591、温度 39.7→38.7，数字在动
- id: UI-03
  category: 界面
  requirement: 打包版（file:// 加载 asar）应能正常挂载，不能白屏
  source: 交付质量
  implementation: electron-builder 打包流程 + app.asar
  verification: node tools/prod-audit.js（解 asar 后用 file:// 打开）
  evidence: reports/evidence/ui-03-prod-file.log
  status: verified
  note: 挂载成功、0 JS 错误、0 资源加载失败；登录受 Chrome file:// 的 localStorage 限制，属测试环境
- id: DATA-05
  category: 数据
  requirement: 物料/能量平衡自检（进 = 出 + 存量变化）
  source: 质量平衡（工业系统最硬的自检）
  implementation: 无
  verification: 无
  evidence: ''
  status: not_done
  note: 30 台设备的模拟数据之间没有真实物料流关系，算出来的"平衡"是编的。 这种证据比没有更糟 —— 会给评审一个"看起来专业但其实是假"的印象。
- id: SEC-03
  category: 安全
  requirement: 配置变更应记录 diff（谁把哪个键从什么改成什么），且日志本身被改动要能发现
  source: GB/T 22239-2019 8.1.4.3 安全审计（审计记录应受到保护，避免未预期的删除、修改或覆盖）
  implementation: core/audit_chain.py（before/after diff + SHA-256 哈希链）+ PUT /api/config 接入
  verification: python tools/audit-chain-selftest.py（9 个篡改对抗用例）+
    python tools/deep-verify.py auditchain
  evidence: reports/deep/audit-chain-selftest.json、reports/deep/auditchain.json
  status: verified
  note: 不只记 diff，还让"改了日志"这件事可被发现 —— 改值/改操作人/删中间/调顺序 4 类
    篡改全部被抓到。尾部截断（哈希链的数学盲区）已由 tools/deepcheck/anchor.py 关闭：
    把 (条数, 最大 seq, 链头哈希) 钉进 reports/evidence/audit-anchors.json 并随 git 提交，
    负向控制第 11 项"删掉最后两条"被判 ANCHOR_TAIL_TRUNCATED。
    现场链为空（尚无配置变更），故 auditchain/anchor 判 INSUFFICIENT，机制有效性由自证承担。
    仍存边界：可重写整个 git 历史者可伪造，需 WORM/外部时间戳。
- id: DATA-06
  category: 数据
  requirement: 点表逐点核对（地址/长度/数据类型/字节序/量程/单位）
  source: 交付规范（IO List）；Modbus 协议规范的字节序定义
  implementation: tools/deepcheck/pointtable.py（独立参考解码器 + 应用解码器差分）
  verification: python tools/deep-verify.py pointtable → reports/deep/io-list.csv
  evidence: reports/deep/pointtable.json、reports/deep/io-list.csv
  status: verified
  note: 69 个点 / 10 台设备 / 4 种字节序 × 6 个哨兵值 = 24 组差分用例全部一致。
    哨兵值选 1.0/0.1/25.3/-273.15/1234.5678/-0.0625（字节不对称），
    0x00000000 这类值在四种字节序下都一样，用它测等于没测。
    顺带修掉 3 个模拟量缺单位（pH/功率因数/回流比，无量纲须显式写 '1'）。
    仍未覆盖：真实设备手册的寄存器表（现场比对，脚本可直接复用同一套）。
- id: DATA-08
  category: 数据
  requirement: 证据必须能被第三方独立复现，而不是"我跑过了"
  source: 科学方法底线（可复现性）；负向控制（negative control）
  implementation: tools/deepcheck/negative_control.py（8 个检测器 × 播种缺陷）、
    tools/make-evidence-fixture.py（可复现夹具）、tools/evidence-manifest.py（哈希清单）
  verification: python tools/deep-verify.py negative-control → 8/8；
    python tools/evidence-manifest.py --verify
  evidence: reports/deep/negative-control.json、reports/evidence/MANIFEST.json
  status: verified
  note: 核心判据：**检测器不能失败，它的通过就不算证据**。每个检测器必须在
    「干净快照=PASS / 播种后=FAIL 且报出预期 finding code」两个方向上都对，
    才计 1 分。8 个全过。运行库被 .gitignore 排除，故另做 2.3MB 夹具，
    保证任何人克隆仓库后一条命令即可重算。
- id: DATA-11
  category: 数据
  requirement: 配置的每个点位都必须真的被采集入库（覆盖率可量化）
  source: 交付验收（IO List 与运行时点表必须一致）
  implementation: tools/deepcheck/coverage.py:det_point_coverage（配置 ↔ history_data 差集）
  verification: python tools/deep-verify.py all → det_point_coverage
  evidence: reports/deep/point_coverage.json
  status: verified
  note: 修复前实测 55/201（27%）—— 所有 Modbus 设备只入库第一个点，REST/MQTT/OPC-UA 全量。
    根因：EnhancedSimulatedClient.read_holding_registers 只按起始地址取一个寄存器、忽略 count，
    采集器的「切片不足就跳过」把其余点静默丢弃。修复后 201/201（100%）。
    ⚠️ 该缺陷不会报错、不会告警，只能靠"配置 ↔ 入库"差集发现。
- id: ALM-06
  category: 报警
  requirement: 每条启用规则都必须能响；数据越限而未产生报警必须为零（漏报率）
  source: ISA-18.2 报警合理化（alarm rationalization）
  implementation: tools/deepcheck/coverage.py:det_alarm_coverage
    （规则阈值 × history_data 值域 × alarm_records 是否存在）
  verification: python tools/deep-verify.py all → det_alarm_coverage
  evidence: reports/deep/alarm_coverage.json
  status: verified
  note: 10 条启用规则：2 条会响、0 条漏报、8 条当前工况永不触发。
    最离谱 current_high 阈值 100A 而实测 10~17A（差 11.7 个包络跨度）——
    保护性阈值可以远，但差值必须能量化并给出工艺出处。
    漏报（ALARM_MISSED）为硬指标：一旦出现即判 FAIL。
- id: DATA-10
  category: 数据
  requirement: 写入路径必须携带权威时间；不得靠"迁移回填"证明写入正确
  source: ACID 之外的工程约束 —— 回填证据与被测行为必须是两件事
  implementation: tools/deepcheck/detectors.py:det_write_path（只看最近 N 分钟写入的行）
  verification: python tools/deep-verify.py all → det_write_path（窗口 30 分钟）
  evidence: reports/deep/write_path.json
  status: verified
  note: 现场实测（源码模式运行 8.5 分钟）：近期写入 8582 行，ts_utc 空值 0，
    created_at 与 ts_utc 最大差 89.5 秒（队列缓冲）。
    诞生原因：上一轮改了 insert_data_batch 的参数个数却没改 realtime_data 的占位符，
    启动后每批写入失败，而当时 8 个检测器全绿——因为它们看的都是迁移回填过的旧数据。
    这条检测器的存在就是为了让同类错误在 30 分钟内暴露。
- id: DATA-09
  category: 数据
  requirement: 新增表/列不得引入第三种时间口径；时间口径必须可查、可校验、可回归
  source: 变更管理（MOC）+ 可维护性
  implementation: tools/deepcheck/schema_clock.py 的 REGISTRY（唯一真源，含 exempt 理由）
    + tools/deepcheck/clock_lint.py（ast 扫 SQL，未登记即失败）
  verification: python tools/deep-verify.py all → det_clock_lint（136 文件 / 20 条登记）
  evidence: reports/deep/clock_lint.json
  status: verified
  note: 规则只有两条：CLOCK_UNREGISTERED_COLUMN（新表用了时间列但没登记）、
    CLOCK_WRONG_DEFAULT（本地口径的列被赋 CURRENT_TIMESTAMP）。
    规则少是故意的 —— 规则多到没人记得住，等于没有门禁。
- id: DATA-07
  category: 数据
  requirement: 备份必须验证「能恢复」，而不只是「生成了文件」
  source: 灾难恢复（RTO/RPO）；没做过恢复演练的备份等于没有备份
  implementation: tools/auto_backup.py 生成备份（走项目自带逻辑，不另写一套）
  verification: python tools/backup-verify.py --backend <backend 目录>
  evidence: reports/evidence/backup-restore.json
  status: verified
  note: 实测备份 97.76MB，PRAGMA integrity_check=ok，8 张表行数与源库逐一相等（含 32.9 万行历史）
